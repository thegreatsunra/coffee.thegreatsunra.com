version: "3"

tasks:
  serve:
    desc: Preview the site locally at http://localhost:3000
    preconditions:
      - sh: command -v npm
        msg: "npm is not installed. Install Node.js from https://nodejs.org"
    cmds:
      - npx serve public

  test:
    desc: Run the JS tests in a Node container
    preconditions:
      - sh: docker info
        msg: "Docker is not running. Start Docker and try again."
    cmds:
      - docker run --rm -v "$PWD":/app -w /app node:24-alpine npm test
